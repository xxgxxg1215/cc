<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}管理后台{% endblock %} - 农作物病害识别系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --primary: #059669;
      --primary-hover: #047857;
      --primary-light: #10B981;
      --primary-bg: #ECFDF5;
      --primary-dark: #064E3B;
      --accent: #F59E0B;
      --accent-bg: #FFFBEB;
      --blue: #3B82F6;
      --blue-bg: #EFF6FF;
      --rose: #F43F5E;
      --rose-bg: #FFF1F2;
      --purple: #8B5CF6;
      --purple-bg: #F5F3FF;
      --bg: #F8FAFC;
      --bg-card: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --border-light: #F1F5F9;
      --shadow-xs: 0 1px 2px rgba(0, 0, 0, .04);
      --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .03);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, .06), 0 2px 4px -2px rgba(0, 0, 0, .04);
      --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, .08), 0 4px 10px -4px rgba(0, 0, 0, .04);
      --radius: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --transition: all .15s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: linear-gradient(180deg, #0F172A 0%, #1E293B 100%);
      color: #fff;
      flex-shrink: 0;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 20px rgba(0, 0, 0, .08);
    }

    .sidebar-brand {
      padding: 24px 22px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    .sidebar-brand .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, #059669, #10B981);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(5, 150, 105, .35);
    }

    .sidebar-brand .logo svg {
      width: 22px;
      height: 22px;
    }

    .sidebar-brand .text h2 {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .sidebar-brand .text p {
      font-size: 11px;
      color: rgba(255, 255, 255, .4);
      margin-top: 1px;
    }

    .sidebar-section {
      padding: 16px 12px 8px;
    }

    .sidebar-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255, 255, 255, .25);
      padding: 0 12px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      color: rgba(255, 255, 255, .55);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 400;
      transition: var(--transition);
      cursor: pointer;
      position: relative;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, .06);
      color: rgba(255, 255, 255, .85);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(5, 150, 105, .2), rgba(16, 185, 129, .1));
      color: #fff;
      font-weight: 500;
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 8px;
      bottom: 8px;
      width: 3px;
      background: #10B981;
      border-radius: 0 3px 3px 0;
    }

    .nav-item svg {
      width: 18px;
      height: 18px;
      opacity: .5;
      flex-shrink: 0;
    }

    .nav-item.active svg {
      opacity: 1;
      color: #10B981;
    }

    .nav-item .badge {
      margin-left: auto;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .1);
      color: rgba(255, 255, 255, .5);
      font-weight: 500;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 16px 22px;
      border-top: 1px solid rgba(255, 255, 255, .06);
      font-size: 11px;
      color: rgba(255, 255, 255, .2);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      margin-left: 260px;
      min-height: 100vh;
    }

    /* ── Top Bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 60px;
      background: rgba(248, 250, 252, .8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .topbar h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .topbar-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      color: var(--text-secondary);
      transition: var(--transition);
      cursor: pointer;
      border: none;
      background: none;
    }

    .topbar-btn:hover {
      background: var(--border-light);
      color: var(--text);
    }

    .topbar-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── Content ── */
    .content {
      padding: 24px 32px 48px;
    }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-xs);
      border: 1px solid var(--border);
      margin-bottom: 20px;
      transition: box-shadow .2s;
    }

    .card:hover {
      box-shadow: var(--shadow);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .card-title .icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-title .icon svg {
      width: 16px;
      height: 16px;
    }

    .card-title .icon.green {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .card-title .icon.blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .card-title .icon.rose {
      background: var(--rose-bg);
      color: var(--rose);
    }

    .card-title .icon.amber {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── Stat Grid ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: var(--transition);
      cursor: default;
    }

    .stat-card:hover {
      box-shadow: var(--shadow-md);
      border-color: transparent;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stat-icon svg {
      width: 20px;
      height: 20px;
    }

    .stat-icon.green {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .stat-icon.blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .stat-icon.amber {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .stat-icon.rose {
      background: var(--rose-bg);
      color: var(--rose);
    }

    .stat-icon.purple {
      background: var(--purple-bg);
      color: var(--purple);
    }

    .stat-body .num {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.2;
    }

    .stat-body .label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ── Table ── */
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      padding: 10px 16px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--border-light);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      letter-spacing: .3px;
    }

    thead th:first-child {
      border-radius: 8px 0 0 0;
    }

    thead th:last-child {
      border-radius: 0 8px 0 0;
    }

    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text);
      vertical-align: middle;
    }

    tbody tr {
      transition: background .12s;
    }

    tbody tr:hover {
      background: #F8FAFC;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    /* ── Tags ── */
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }

    .tag-green {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .tag-red {
      background: var(--rose-bg);
      color: var(--rose);
    }

    .tag-gray {
      background: var(--border-light);
      color: var(--text-secondary);
    }

    .tag-blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .tag-amber {
      background: var(--accent-bg);
      color: #B45309;
    }

    .tag-purple {
      background: var(--purple-bg);
      color: var(--purple);
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
      transition: var(--transition);
      font-family: inherit;
    }

    .btn svg {
      width: 14px;
      height: 14px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 2px 8px rgba(5, 150, 105, .25);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-secondary);
      border-color: var(--border);
    }

    .btn-outline:hover {
      background: var(--border-light);
      color: var(--text);
      border-color: var(--text-muted);
    }

    .btn-danger {
      background: var(--rose-bg);
      color: var(--rose);
      border-color: #FECDD3;
    }

    .btn-danger:hover {
      background: var(--rose);
      color: #fff;
    }

    .btn-ghost {
      background: none;
      color: var(--text-secondary);
      padding: 5px 8px;
    }

    .btn-ghost:hover {
      background: var(--border-light);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* ── Search Bar ── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--border-light);
      border-radius: 10px;
      padding: 0 14px;
      border: 1.5px solid transparent;
      transition: var(--transition);
    }

    .search-bar:focus-within {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, .08);
    }

    .search-bar svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-bar input {
      flex: 1;
      padding: 9px 0;
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    /* ── Forms ── */
    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      transition: var(--transition);
      background: #fff;
      color: var(--text);
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, .08);
    }

    .form-group textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.7;
    }

    /* ── Pagination ── */
    .pagination {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .pagination a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 36px;
      height: 36px;
      padding: 0 10px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      transition: var(--transition);
      cursor: pointer;
    }

    .pagination a:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-bg);
    }

    .pagination a.current {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* ── Misc ── */
    .chart-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .flex-gap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .img-thumb {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    .text-muted {
      color: var(--text-muted);
    }

    .text-sm {
      font-size: 12px;
    }

    .text-mono {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
    }

    .mt-8 {
      margin-top: 8px;
    }

    .mb-16 {
      margin-bottom: 16px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      opacity: .3;
    }

    .empty-state p {
      font-size: 14px;
    }

    /* ── Confidence Colors (admin_history) ── */
    .conf-high { color: var(--primary); }
    .conf-mid  { color: var(--accent); }
    .conf-low  { color: var(--rose); }

    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .filter-tab {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      color: var(--text-secondary);
      background: var(--border-light);
      transition: var(--transition);
      cursor: pointer;
      border: none;
    }

    .filter-tab:hover {
      background: var(--border);
    }

    .filter-tab.active {
      background: var(--primary);
      color: #fff;
    }

    @media (max-width:1200px) {
      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width:768px) {
      .sidebar {
        display: none;
      }

      .main {
        margin-left: 0;
      }

      .content {
        padding: 16px;
      }

      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="logo"><svg viewBox="0 0 32 32" fill="none">
            <path d="M16 6c0 0-7 5-7 12s7 7 7 7 7 0 7-7-7-12-7-12z" fill="#fff" opacity=".9" />
            <path d="M16 8v14" stroke="rgba(255,255,255,.4)" stroke-width="1.5" />
            <path d="M16 13l-3 3M16 16l3-3" stroke="rgba(255,255,255,.3)" stroke-width="1.2" />
          </svg></div>
        <div class="text">
          <h2>CropGuard</h2>
          <p>病害识别管理平台</p>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">概览</div>
        <nav class="sidebar-nav">
          <a href="/admin/dashboard" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            数据大盘
          </a>
        </nav>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">内容管理</div>
        <nav class="sidebar-nav">
          <a href="/admin/history" class="nav-item {% if active == 'history' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
            </svg>
            识别记录
          </a>
          <a href="/admin/news" class="nav-item {% if active == 'news' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2" />
              <path d="M18 14h-8M15 18h-5M10 6h8" />
            </svg>
            新闻资讯
          </a>
          <a href="/admin/community" class="nav-item {% if active == 'community' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            社区帖子
          </a>
          <a href="/admin/encyclopedia" class="nav-item {% if active == 'encyclopedia' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
            </svg>
            病害百科
          </a>
        </nav>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-section-title">系统</div>
        <nav class="sidebar-nav">
          <a href="/admin/users" class="nav-item {% if active == 'users' %}active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            用户管理
          </a>
        </nav>
      </div>
