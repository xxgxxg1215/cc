<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 农作物病害识别管理后台</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #064E3B;
            background-image:
                radial-gradient(ellipse 80% 50% at 50% 0%, rgba(16, 185, 129, .3), transparent),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(5, 150, 105, .2), transparent);
        }

        .login-wrapper {
            width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #fff;
            border-radius: 20px;
            padding: 44px 40px 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, .2), 0 0 0 1px rgba(255, 255, 255, .05);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 16px;
            background: linear-gradient(135deg, #059669, #10B981);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(5, 150, 105, .3);
        }

        .login-icon svg {
            width: 28px;
            height: 28px;
            color: #fff;
        }

        .login-header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #064E3B;
            margin-bottom: 4px;
        }

        .login-header p {
            font-size: 14px;
            color: #6B7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            border: 1.5px solid #E5E7EB;
            border-radius: 10px;
            transition: all .2s;
            background: #fff;
        }

        .input-wrap:focus-within {
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, .1);
        }

        .input-wrap svg {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: #9CA3AF;
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            padding: 11px 14px 11px 42px;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: inherit;
            background: transparent;
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #059669, #10B981);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(5, 150, 105, .25);
        }

        .btn-login:hover {
            opacity: .92;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(5, 150, 105, .3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error {
            background: #FEF2F2;
            color: #DC2626;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #FECACA;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <svg viewBox="0 0 32 32" fill="none">
                        <path d="M16 6c0 0-7 5-7 12s7 7 7 7 7 0 7-7-7-12-7-12z" fill="#fff" opacity=".9" />
                        <path d="M16 8v14" stroke="rgba(255,255,255,.5)" stroke-width="1.5" />
                    </svg>
                </div>
                <h1>管理后台</h1>
                <p>农作物病害识别系统</p>
            </div>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="POST" action="/admin/login">
                <div class="form-group">
                    <label>用户名</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" name="username" placeholder="请输入管理员用户名" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" name="password" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">登 录</button>
            </form>
        </div>
    </div>
</body>

</html>
